services:
  postgres_projet1:
    image: postgres:16
    container_name: postgres_projet1
    restart: always
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
      POSTGRES_DB: meteo_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_platform_net

  metabase_projet1:
    image: metabase/metabase:latest
    container_name: metabase_projet1
    restart: always
    ports:
      - "3002:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    networks:
      - data_platform_net

volumes:
  postgres_data:
  metabase_data:

networks:
  data_platform_net:
    external: true